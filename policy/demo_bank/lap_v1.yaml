# Demo Bank (fictional) - Loan Against Property (LAP) Policy v1.0.0 (DRAFT)
# SYNTHETIC. Designed from the public SBI and ICICI Bank LAP study (docs/studies/lap_sbi_icici.md, 24 Nov 2026)
# and RBI Master Directions. Not based on any bank's internal circulars.
bank: Demo Bank (fictional)
product: lap
policy_version: "1.0.0"
effective_from: 2027-01-01
status: draft
synthetic: true
rbi_corpus_version:
  CF: "RBI (Commercial Banks - Credit Facilities) Directions, 2025 - updated as on 2026-10-01"
  RBC: "RBI (Commercial Banks - Responsible Business Conduct) Directions, 2025 - updated as on 2026-10-01"
design_basis:
  - id: LAP-STUDY
    title: "Loan against property: SBI and ICICI Bank published terms, as on 24 Nov 2026"
    url: docs/studies/lap_sbi_icici.md

rules:

  # ---------------- ELIGIBILITY ----------------
  - rule_id: DB-LAP-001
    section: eligibility
    title: Purposes and prohibited uses
    rule: >-
      A Demo Bank loan against property (LAP) may be used for any personal purpose, such as
      education, medical treatment, a wedding or debt consolidation, or for the borrower's own
      business, or to take over an existing LAP from another lender. The applicant states the
      purpose in a signed end-use undertaking. LAP may not be used for speculation in real
      estate or land, for buying shares, mutual funds or other capital market investments, for
      purchase of gold in any form, for lending on to others, or for any illegal or anti-social
      purpose. A loan to buy or build a home is a home loan, not LAP.
    params:
      purposes: [personal, own_business, takeover]
      prohibited: [real_estate_speculation, capital_market, gold_purchase, onward_lending, illegal]
    rbi_ref: {direction: CF, para: "36", note: "No advance for purchase of gold in any form; other exclusions are bank policy"}
    bank_discretion: false
    vs_rbi: stricter
    design_basis: [SBI-LAP-S1, ICICI-LAP-S2, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-002
    section: eligibility
    title: Eligible applicants and property owners
    rule: >-
      Only individuals may apply: resident Indian individuals who are salaried, self-employed
      professionals or self-employed non-professionals. Firms, LLPs, companies, trusts, societies
      and HUFs cannot be applicants or co-applicants. The property must be owned by the applicant,
      or jointly with or solely by the applicant's spouse, parent, son, daughter or sibling, and
      every owner of the property must join the loan as co-applicant. NRI applicants are not
      covered by this policy version.
    params:
      applicant_types: [salaried, self_employed_professional, self_employed_non_professional]
      excluded_applicants: [partnership_firm, llp, company, trust, society, huf]
      owner_relationships: [self, spouse, parent, son, daughter, sibling]
      every_owner_co_applicant: true
      nri_covered: false
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, ICICI-LAP-S2, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-003
    section: eligibility
    title: Age at entry and at maturity
    rule: >-
      The applicant must be at least 21 years old on the date of sanction. The loan must be
      fully repaid by age 65 for salaried applicants without pension and by age 70 for
      self-employed applicants and pension-earning applicants, counting the age of the oldest
      earning co-applicant whose income is used. Pension-earning has the same meaning as in the
      home loan policy: an applicant who receives a pension or annuity, a defined-benefit
      pension scheme member, or any NPS subscriber.
    params:
      min_entry_age: 21
      max_age_at_maturity: {salaried_non_pension: 65, salaried_pension: 70, self_employed: 70}
      age_basis: oldest_earning_co_applicant
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, ICICI-LAP-S3, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-004
    section: eligibility
    title: Minimum income and work history
    rule: >-
      Salaried applicants need a net monthly income of at least Rs 25,000 and at least 2 years
      of total work experience, including 6 months with the current employer. Self-employed
      applicants need at least 3 years in the current business and income tax returns for the
      last 2 years showing an annual income of at least Rs 3,60,000.
    params:
      salaried: {min_net_monthly_income: 25000, min_total_experience_years: 2, min_current_employer_months: 6}
      self_employed: {min_business_vintage_years: 3, itr_years: 2, min_annual_income: 360000}
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-005
    section: eligibility
    title: Credit score
    rule: >-
      The minimum credit bureau score is 720. Applicants with no credit history are not
      eligible for LAP. Scores from 700 to 719 need a deviation approval (DB-LAP-019). Scores
      below 700 are declined.
    params: {min_score: 720, ntc_allowed: false, deviation_floor: 700}
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  # ---------------- AMOUNT AND LTV ----------------
  - rule_id: DB-LAP-006
    section: amount_ltv
    title: Loan amount limits
    rule: >-
      The minimum LAP is Rs 10 lakh and the maximum is Rs 5 crore, subject to the LTV limit
      (DB-LAP-007) and repayment capacity (DB-LAP-008).
    params: {min_amount: 1000000, max_amount: 50000000}
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-007
    section: amount_ltv
    title: Loan-to-value (LTV) limits
    rule: >-
      The loan may not exceed a share of the property's market value as assessed by the bank's
      valuer: for a residential property, 65% for loans up to Rs 1 crore and 60% for loans above
      Rs 1 crore; for a commercial property (office or shop), 55% for any loan amount. Where two
      or more properties are mortgaged, the limit is applied to each property and the results
      are added. No RBI LTV ceiling applies to LAP; these limits are Demo Bank's own.
    params:
      residential: [{max_loan: 10000000, max_ltv: 0.65}, {max_loan: null, max_ltv: 0.60}]
      commercial: [{max_loan: null, max_ltv: 0.55}]
      value_basis: bank_valuer_market_value
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, SBI-LAP-S2, ICICI-LAP-S1, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-008
    section: amount_ltv
    title: Repayment capacity (FOIR) and rental income
    rule: >-
      Total monthly obligations, meaning the proposed EMI plus all existing EMIs and 5% of credit
      card outstanding, may not exceed a share of net monthly income (NMI): 50% for NMI up to
      Rs 50,000, 55% for NMI above Rs 50,000 up to Rs 1,00,000, and 60% for NMI above
      Rs 1,00,000. Rent from a let-out property may be counted at 75% of the rent, only if it is
      paid under a registered lease and credited to the applicant's bank account for the last 6
      months.
    params:
      foir_bands: [{max_nmi: 50000, max_foir: 0.50}, {max_nmi: 100000, max_foir: 0.55}, {max_nmi: null, max_foir: 0.60}]
      card_outstanding_pct_as_emi: 0.05
      rental_income: {share_counted: 0.75, registered_lease: true, bank_credit_months: 6}
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-009
    section: amount_ltv
    title: Tenure and repayment form
    rule: >-
      LAP is a term loan repaid in monthly EMIs over 3 to 15 years, and may not run beyond the
      maturity age in DB-LAP-003. Demo Bank does not offer LAP as an overdraft in this policy
      version.
    params: {min_tenure_years: 3, max_tenure_years: 15, overdraft: false}
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, ICICI-LAP-S2, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  # ---------------- PRICING ----------------
  - rule_id: DB-LAP-010
    section: pricing
    title: Interest rate benchmark and spread
    rule: >-
      All LAP loans are floating rate, linked to the RBI policy repo rate. The rate is the repo
      rate plus a spread fixed at sanction by credit score: 800 and above, 3.40%; 750 to 799,
      3.65%; 720 to 749, 3.90%. A loan secured by a commercial property pays 0.25% more. The
      spread is fixed for the life of the loan; only the repo rate moves.
    params:
      benchmark: repo
      spread_by_score: [{min: 800, spread: 0.034}, {min: 750, spread: 0.0365}, {min: 720, spread: 0.039}]
      commercial_property_add_on: 0.0025
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-011
    section: pricing
    title: Interest reset and borrower options
    rule: >-
      The rate resets on the first day of each calendar quarter, using the repo rate in
      force on the last day of the previous quarter. At sanction the borrower is told
      how a benchmark change can affect the EMI or tenure. At each upward reset the
      borrower may choose a higher EMI, a longer tenure within DB-LAP-009 and the age
      limit in DB-LAP-003, or both, and may prepay in part or in full at any time. If
      the longest tenure allowed within the maximum tenure and age limit does not absorb
      the increase, the borrower may choose a higher EMI or a combination; a higher EMI
      is always available. A tenure extension may not cause negative amortisation. Any
      increase in EMI or tenure is told to the borrower at once by SMS and email, and
      every quarter the borrower receives a statement of principal and interest
      recovered, the EMI, the EMIs left and the annualised rate (APR). Demo Bank does
      not offer a switch to a fixed rate. These options apply to every LAP borrower,
      whether the purpose is personal or business.
    rbi_ref: {direction: RBC, para: "349", note: "Extended to business-purpose LAP (RBI requires them for personal loans). Tenure extension capped by DB-LAP-009 and DB-LAP-003 (349 sets no cap beyond no negative amortisation, 349(5)); a higher EMI is always available. Fixed-rate switch is optional for the bank (349(2)): not offered"}
    bank_discretion: false
    vs_rbi: equal
    design_basis: [synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted. Changed 24 Nov 2026 after conflict check (2/3 looser on the tenure cap): cap stated with higher-EMI fallback, no fixed-rate switch stated, label stricter -> equal (Anurag)"

  # ---------------- CHARGES ----------------
  - rule_id: DB-LAP-012
    section: charges
    title: Processing, legal and valuation charges
    rule: >-
      The processing fee is 0.75% of the loan amount, at least Rs 5,000 and at most Rs 30,000,
      plus GST, charged only after sanction. Legal scrutiny and valuation are charged at actual
      cost, capped at Rs 10,000 in total plus GST; loans above Rs 1 crore need two independent
      valuations and the lower value is used. CERSAI registration is Rs 100 plus GST. All charges
      are listed in the application form and the Key Facts Statement.
    params:
      processing_fee: {pct: 0.0075, min: 5000, max: 30000}
      legal_valuation_cap: 10000
      two_valuations_above: 10000000
      cersai: 100
    rbi_ref: {direction: RBC, para: "327", note: "All fees and charges disclosed in the application form and KFS"}
    bank_discretion: false
    vs_rbi: equal
    design_basis: [SBI-LAP-S1, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-013
    section: charges
    title: Prepayment and foreclosure
    rule: >-
      No prepayment or foreclosure charge applies to any floating-rate LAP to an individual,
      whether the loan is for a personal or a business purpose, whatever the source of funds and
      with no lock-in period. This is stated in the sanction letter, the loan agreement and the
      Key Facts Statement. A charge Demo Bank has waived earlier is never levied later.
    rbi_ref: {direction: RBC, para: "353"}
    bank_discretion: false
    vs_rbi: equal
    design_basis: [SBI-LAP-S1]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-014
    section: charges
    title: Penal charges for late payment
    rule: >-
      If an EMI is not paid by its due date, a penal charge of 3% per annum is levied on the
      overdue EMI amount only, for the days it stays overdue. It is a charge, not an addition to
      the interest rate, and no interest is charged on it. No penal charge is levied on unpaid
      penal charges. The amount and reason are disclosed in the loan agreement, the Key Facts
      Statement and on Demo Bank's website, stated in every reminder, and told to the borrower
      each time it is levied.
    rbi_ref: {direction: RBC, para: "351"}
    bank_discretion: false
    vs_rbi: equal
    design_basis: [synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  # ---------------- PROPERTY ----------------
  - rule_id: DB-LAP-015
    section: property
    title: Acceptable and excluded properties
    rule: >-
      Demo Bank accepts a completed, self-occupied or let-out residential house or flat, or a
      completed commercial office or shop, with a clear and marketable title verified by the
      bank's advocate, a sanctioned building plan and an occupancy or completion certificate.
      It does not accept: vacant plots, agricultural land, industrial or special-use property
      (such as hotels, hospitals or schools), property under construction, property in an
      unauthorised colony unless the colony has been regularised and its charges paid, property
      under litigation, or property already mortgaged to another lender unless that loan is
      taken over and closed first.
    params:
      accepted: [residential_completed, commercial_office_or_shop_completed]
      excluded: [vacant_plot, agricultural_land, industrial, special_use, under_construction, unauthorised_colony_unregularised, litigation, existing_other_lender_charge_without_takeover]
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, ICICI-LAP-S2, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-016
    section: property
    title: Security, rent assignment and insurance
    rule: >-
      The loan is secured by a registered or equitable mortgage of the property, with every owner
      as mortgagor, registered with CERSAI. Where rent from the property is counted for
      eligibility, the rent is also assigned to Demo Bank and the tenant signs a tripartite letter
      to pay it into the borrower's Demo Bank account. The building must be insured against fire,
      flood, earthquake and allied perils for at least its reconstruction cost, with Demo Bank as
      loss payee, until the loan is closed; the borrower may choose any insurer. Life cover is
      optional and never a condition of sanction.
    params: {mortgage: [registered, equitable], cersai: true, rent_assignment_if_counted: true, insurance: building_reconstruction_cost, life_cover_mandatory: false}
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  # ---------------- PROCESS ----------------
  - rule_id: DB-LAP-017
    section: process
    title: Disbursement and end-use check
    rule: >-
      The loan is disbursed in one tranche into the borrower's own bank account, or, on a
      takeover, directly to the existing lender, after the mortgage is created. For a
      business-purpose loan, the borrower gives proof of how the money was used, such as invoices
      or bank statements, within 90 days of disbursement. If Demo Bank finds the loan used for a
      prohibited purpose (DB-LAP-001), it may recall the loan.
    params: {tranches: 1, disburse_to: [borrower_account, existing_lender_on_takeover], business_end_use_proof_days: 90}
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [SBI-LAP-S1, synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  - rule_id: DB-LAP-018
    section: process
    title: Key Facts Statement
    rule: >-
      Before sanction, every applicant receives a Key Facts Statement in RBI's standard format,
      with a unique proposal number, the APR and the amortisation schedule, in a language they
      understand. Bank staff explain it and obtain the borrower's acknowledgement. It is valid
      for at least 3 working days, and if the borrower accepts within that period Demo Bank is
      bound by its terms. It lists charges payable to Demo Bank separately from third-party
      charges, and is attached to the loan agreement as a summary box. No charge missing from
      the KFS may be levied without the borrower's explicit consent.
    rbi_ref: {direction: RBC, para: "348"}
    bank_discretion: false
    vs_rbi: equal
    design_basis: [synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"

  # ---------------- GOVERNANCE ----------------
  - rule_id: DB-LAP-019
    section: governance
    title: Deviations
    rule: >-
      The Regional Credit Head may approve these deviations, recording the reason and the
      mitigating strength: maturity age up to 2 years beyond DB-LAP-003; FOIR up to 5 percentage
      points above DB-LAP-008; credit score from 700 to 719; income up to 10% below the minimum in
      DB-LAP-004; loan amount up to 10% above the maximum in DB-LAP-006; tenure up to 2 years
      beyond the maximum in DB-LAP-009. No more than two deviations are allowed in one loan. No deviation is permitted on LTV (DB-LAP-007), prohibited purposes
      (DB-LAP-001), excluded properties (DB-LAP-015), prepayment (DB-LAP-013), penal charges
      (DB-LAP-014) or the KFS (DB-LAP-018).
    params:
      approver: regional_credit_head
      max_deviations: 2
      allowed: {age_years: 2, foir_pp: 5, score_floor: 700, income_below_min_pct: 10,
                amount_above_max_pct: 10, tenure_years: 2}
      prohibited_rule_ids: [DB-LAP-001, DB-LAP-007, DB-LAP-013, DB-LAP-014, DB-LAP-015, DB-LAP-018]
    bank_discretion: true
    vs_rbi: not_applicable
    design_basis: [synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted. Anurag 28 Nov 2026: income, loan amount and tenure (and, for home loan, residual life) made deviable by the Regional Credit Head; limits as proposed by Claude and accepted (income 10% below minimum, amount 10% above maximum, tenure 2 years); same structure as home loan, LAP keeps its own score band."

  - rule_id: DB-LAP-020
    section: governance
    title: Return of property documents after closure
    rule: >-
      Original property documents are returned, and the satisfaction of charge filed with every
      registry where the charge was registered (such as CERSAI), within 15 working days of full
      repayment, at the branch or another office of the borrower's choice. If the documents are
      not returned within 30 days, Demo Bank tells the borrower the reason, and if the delay is
      attributable to Demo Bank it pays the borrower Rs 5,000 for each day of delay. If documents
      are lost or damaged, Demo Bank helps the borrower obtain duplicate or certified copies at
      its own cost within a further 30 days, after which the daily compensation applies.
    rbi_ref: {direction: RBC, para: "354, 355, 358, 359"}
    bank_discretion: false
    vs_rbi: stricter
    design_basis: [synthetic]
    review: ok
    review_note: "Reviewed 24 Nov 2026: accepted as drafted"
